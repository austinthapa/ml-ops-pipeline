apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-attack-pred-deployment
  labels:
    app: heart-attack-pred
spec:
  replicas: 3
  selector:
    matchLabels:
      app: heart-attack-pred
  template:
    metadata:
      labels:
        app: heart-attack-pred
    spec:
      containers:
        - name: heart-attack-container
          image: 243124497032.dkr.ecr.us-east-1.amazonaws.com/heart-attack-pred:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20